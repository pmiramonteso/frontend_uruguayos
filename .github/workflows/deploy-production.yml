name: Deploy producción

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a desplegar (commit, rama o tag). Vacío = la misma que está en staging'
        required: false
        default: ''

jobs:
  version:
    name: Elegir versión
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            ref="${{ inputs.version }}"
          else
            ref=$(gh api "repos/${{ github.repository }}/contents/.deploy-info?ref=deploy-staging" --jq .content | base64 -d | tr -d '[:space:]')
          fi
          echo "Versión a desplegar en producción: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: version
    # El job llamado sube la rama deploy-*: necesita permiso de escritura
    permissions:
      contents: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      ref: ${{ needs.version.outputs.ref }}
    secrets: inherit
