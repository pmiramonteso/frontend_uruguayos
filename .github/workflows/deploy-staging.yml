name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # El job llamado sube la rama deploy-*: necesita permiso de escritura
    permissions:
      contents: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
    secrets: inherit
