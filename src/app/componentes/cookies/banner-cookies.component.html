@if (cookies.mostrarBanner()) {
<div class="fixed bottom-0 inset-x-0 z-[10000] p-4" role="dialog" aria-labelledby="cookies-titulo">
  <div class="max-w-3xl mx-auto bg-white text-gray-700 rounded-lg shadow-2xl p-5 flex flex-col md:flex-row md:items-center gap-4">
    <div class="flex-1">
      <h2 id="cookies-titulo" class="font-semibold text-gray-900 mb-1">Usamos cookies</h2>
      <p class="text-sm">
        Con tu permiso, usamos cookies de Google Analytics para saber cómo se usa la web y mejorarla.
        Puedes cambiar tu elección cuando quieras.
        <a routerLink="/cookies" class="text-teal-600 underline">Política de cookies</a>
      </p>
    </div>
    <div class="flex gap-3 shrink-0">
      <button (click)="cookies.rechazar()"
        class="py-2 px-4 rounded-lg border border-teal-500 text-teal-600 hover:bg-teal-50 transition">
        Rechazar
      </button>
      <button (click)="cookies.aceptar()"
        class="py-2 px-4 rounded-lg bg-teal-500 text-white hover:bg-teal-600 transition">
        Aceptar
      </button>
    </div>
  </div>
</div>
}
