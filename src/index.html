       Si ya aceptó en otra visita, se concede antes de cargar GTM para no perder la primera página. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });
    // Mismo formato y plazo (12 meses) que src/app/service/cookies.service.ts
    try {
      var c = JSON.parse(localStorage.getItem('cookies-consentimiento') || 'null');
      if (c && c.valor === 'aceptado' && Date.now() - c.fecha <= 365 * 24 * 60 * 60 * 1000) {
        gtag('consent', 'update', { analytics_storage: 'granted' });
      }
    } catch (e) {}
  </script>
